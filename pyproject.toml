[project]
name = "ghost-data-audit"
version = "0.1.0"
description = "Ghost Data Still Exists - an AI deletion-audit agent (HackerRank Orchestrate, October 2026)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core==1.7.0",
    "langgraph==1.2.17",
    "langchain-anthropic==1.7.6",
    "pydantic==2.14.1",
    "pdfplumber==0.11.10",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code/ghost"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures reproduce real evidence lines, which must stay on one line.
"code/tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ghost"]
mypy_path = "code"
